<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a2933">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/mrzahi-icon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/mrzahi-icon-180.png?v=2">
  <title>ربط شاشة زاهي | MrZahi</title>
  <style>
    /* صفحة عبور لباركود شاشة زاهي: تتحقق من ان العنوان محلي ثم تنتقل الى بطاقة التقويم
       في الاعدادات حيث زر «اربط شاشتي». لا تطلب شيئا بنفسها ولا تحمل اي رمز. */
    html, body { margin: 0; min-height: 100%; background: #1a2933; color: #f2f5f7; font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
    main { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; box-sizing: border-box; text-align: center; }
    .card { max-width: 28rem; }
    .card img { width: 160px; max-width: 60%; height: auto; margin-bottom: 1.25rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
    p { margin: 0 0 0.5rem; line-height: 1.7; color: #c9d3d9; }
    p[lang="en"] { direction: ltr; }
    a.btn { display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem; border-radius: 12px; background: #2fa84f; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <img src="/mrzahi-logo-full-dark.png?v=2" alt="MrZahi">
      <h1 id="title">جار فتح الاعدادات لربط شاشتك…</h1>
      <p id="msg"></p>
      <p id="msgEn" lang="en"></p>
      <a class="btn" id="btn" href="/app/settings.html#calendarCard" hidden>فتح الاعدادات</a>
    </div>
  </main>
  <script>
    (function () {
      var to = "";
      try { to = String(new URLSearchParams(window.location.search).get("to") || "").trim().toLowerCase(); } catch (e) { to = ""; }
      /* عناوين الشبكة المحلية فقط: 10.x و172.16-31.x و192.168.x او اسم ينتهي بـ .local؛
         اي شيء غير ذلك يرفض كي لا يصنع احد رابطا يسرب الرمز الى خادم غريب */
      var ok = to.length <= 64 && /^(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|[a-z0-9-]+\.local)$/.test(to);
      if (ok) {
        window.location.replace("/app/settings.html?link=" + encodeURIComponent(to) + "#calendarCard");
        return;
      }
      document.getElementById("title").textContent = "رابط الربط غير صالح";
      document.getElementById("msg").textContent = "امسح الباركود الظاهر على شاشة زاهي مرة اخرى وجوالك على شبكة الجهاز نفسها.";
      document.getElementById("msgEn").textContent = "Invalid link. Scan the code on the Zahi screen again while your phone is on the device's network.";
      document.getElementById("btn").hidden = false;
    })();
  </script>
</body>
</html>
