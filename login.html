    :root, [data-theme="light"] {
      --primary: rgb(0, 104, 184);

      --primary-dark: rgb(0, 88, 160);

      --shadow-dark: rgba(0, 0, 0, 0.08);

      --error: rgb(255, 59, 48);
    }
    [data-theme="dark"] {
      --primary: rgb(0, 160, 210);
      --primary-light: rgb(40, 180, 220);
      --primary-dark: rgb(0, 140, 190);
      --text-primary: rgb(255, 255, 255);
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-tertiary: rgba(255, 255, 255, 0.55);
      --bg-top: rgb(31, 46, 56);
      --bg-mid: rgb(26, 41, 51);
      --bg-bottom: rgb(20, 36, 46);
      --glass: rgba(255,255,255,0.08);
      --glass-border: rgba(255,255,255,0.15);
      --glass-strong: rgba(255, 255, 255, 0.12);
      --shadow-light: rgba(255, 255, 255, 0.05);
      --shadow-dark: rgba(5, 10, 15, 0.3);
      --primary-shadow: rgba(0, 160, 210, 0.35);
      --success: rgb(52, 199, 89);
      --error: rgb(255, 59, 48);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg-bottom); }
    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
      color: var(--text-primary);
      line-height: 1.8;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
    body.has-site-header { padding-top: 52px; }
    .header {
      text-align: center;
      padding: 3rem 2rem;
      background: var(--glass);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
    [data-theme="dark"] .header { box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .content {
      background: var(--glass);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      padding: 3rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    [data-theme="dark"] .content { box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    h2 {
      font-size: 1.8rem;
      margin: 2rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--primary);
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    h2:first-of-type { margin-top: 0; }
    p { margin-bottom: 1rem; color: var(--text-secondary); }
    .content a { color: var(--primary); text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .highlight { font-weight: 600; color: var(--primary); }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: var(--white);
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px var(--primary-shadow);
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--primary-shadow);
    }
    /* Sign-in form controls (verbatim from index.html) */
    .waitlist-form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }
    .waitlist-input {
      flex: 1;
      min-width: 140px;
      padding: 0.7rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass);
      color: var(--text-primary);
      font-size: 0.9rem;
    }
    .waitlist-input::placeholder { color: var(--text-tertiary); }
    .waitlist-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0, 160, 210, 0.2);
    }
    .waitlist-btn {
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .waitlist-btn:hover { background: var(--primary-light); transform: translateY(-1px); }
    .waitlist-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .waitlist-msg { margin-top: 0.5rem; font-size: 0.85rem; }
    .waitlist-msg.success { color: var(--success); }
    .waitlist-msg.error { color: var(--error); }
    /* Sign-in card layout */
    .login-intro { text-align: center; }
    /* زر تسجيل الدخول — منقول حرفيا من زر تطبيق باركينزي (LoginView.swift):
       ارتفاع 56، خلفية زجاجية، إطار 1.5، زاوية 16، ظل نيومورفيك،
       شعار جوجل 24×24 في الطرف والنص في المنتصف. */
    .app-signin-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 56px;
      padding: 0 3.5rem;
      background: var(--glass);
      border: 1.5px solid var(--glass-border);
      border-radius: 16px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 4px 4px 5px var(--shadow-dark), -4px -4px 5px var(--shadow-light);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .app-signin-btn:hover { transform: translateY(-2px); }
    .app-signin-btn:active { box-shadow: 2px 2px 3px var(--shadow-dark), -2px -2px 3px var(--shadow-light); transform: none; }
    .app-signin-btn:disabled { opacity: 0.6; cursor: default; transform: none; }
    .app-signin-logo {
      position: absolute;
      inset-inline-start: 20px;
      width: 24px;
      height: 24px;
    }

    .login-stack {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 420px;
      margin: 0 auto;
    }
    .login-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      margin: 0.25rem 0;
    }
    .login-divider::before, .login-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }
    .login-stack .waitlist-msg { text-align: center; margin-bottom: 0; }
    .login-note { text-align: center; font-size: 0.85rem; margin-top: 1.5rem; margin-bottom: 0; }
    .login-note + .login-note { margin-top: 0.5rem; }
    @media (max-width: 768px) {
      .container { padding: 1rem; margin: 0 auto; }
      .content { padding: 2rem 1.5rem; }
      .header, .content h1, .content h2 { text-align: center; }
      h1 { font-size: 2rem; }
      h2 { font-size: 1.5rem; }
    }


    /* ══ موسم اليوم الوطني السعودي الـ96 «عزنا بطبعنا» ══════════════════════════
       امر المهندس رعد 2026-09-11. الالوان والخط من دليل الهوية الرسمي
       (SND-GUIDELINE): الاخضر الغامق ‎#008849‎ اساس النظام البصري، والليموني
       ‎#5ab91c‎ والذهبي ‎#7b5d20‎ مكملان، والخلفية الداكنة ‎#002528‎، والخط السعودي
       للعناوين وIBM Plex Sans Arabic للنص. طبقة موقتة: تطفا بحذف هذه الكتلة
       وسطر التفعيل في brand-logo.js، ولا تمس اي اصل. */
    @font-face {
      font-family: "Saudi";
      src: url("/Saudi-Regular.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "Saudi";
      src: url("/Saudi-Bold.woff2") format("woff2");
      font-weight: 700; font-style: normal; font-display: swap;
    }
    html[data-season="nd96"] {
      --primary: rgb(0, 136, 73);
      --primary-light: rgb(90, 185, 28);
      --primary-dark: rgb(0, 102, 58);
      --secondary: rgb(123, 93, 32);
      --accent: rgb(90, 185, 28);
      --primary-shadow: rgba(0, 136, 73, 0.35);
      --bg-top: rgb(0, 52, 57);
      --bg-mid: rgb(0, 43, 48);
      --bg-bottom: rgb(0, 37, 40);
    }
    html[data-season="nd96"][data-theme="light"] {
      --primary: rgb(0, 136, 73);
      --primary-light: rgb(90, 185, 28);
      --primary-dark: rgb(0, 92, 50);
      --secondary: rgb(123, 93, 32);
      --accent: rgb(0, 136, 73);
      --primary-shadow: rgba(0, 136, 73, 0.3);
      --btn-ink: rgb(255, 255, 255);
    }
    /* الخط السعودي للعناوين وحدها كما في الدليل؛ النص يبقى IBM Plex Sans Arabic */
    html[data-season="nd96"] h1,
    html[data-season="nd96"] h2,
    html[data-season="nd96"] h3,
    html[data-season="nd96"] .hero-title,
    html[data-season="nd96"] .tagline {
      font-family: "Saudi", "IBM Plex Sans Arabic", system-ui, sans-serif;
      letter-spacing: 0;
    }
    /* شريط الهوية: نقوش السدو الهندسية باخضر الهوية والذهبي، وشعارها اللفظي */
    html[data-season="nd96"]::after {
      content: "عزنا بطبعنا · اليوم الوطني السعودي 96";
      position: fixed; inset-block-start: 0; inset-inline: 0; height: 30px;
      display: flex; align-items: center; justify-content: center;
      font: 700 0.78rem/1 "Saudi", "IBM Plex Sans Arabic", system-ui, sans-serif;
      letter-spacing: 0.02em; color: rgb(244, 238, 221);
      background:
        repeating-linear-gradient(135deg, rgba(123,93,32,0.28) 0 6px, transparent 6px 14px),
        linear-gradient(90deg, rgb(0, 37, 40) 0%, rgb(0, 136, 73) 45%, rgb(90, 185, 28) 100%);
      border-block-end: 1px solid rgba(123, 93, 32, 0.6);
      z-index: 9999; pointer-events: none;
    }
    /* الشريط يسكن فوق الراس نفسه: يزاد حشو ‎.site-header‎ العلوي بقدره، فتقيس
   ‎syncSiteHeaderHeight‎ الارتفاع الجديد وتنزل معه ‎.app-topbar‎ والشريط الجانبي
   وحشو الصفحة تلقائيا — بلا لمس اي شيفرة ولا قيمة ثابتة تتعارض معها. */
html[data-season="nd96"] .site-header { padding-block-start: calc(0.4rem + 30px); }
html[data-season="nd96"] body:not(.has-app-topbar) { padding-block-start: 30px; }
/* شبكة معينات هندسية خافتة خلف المحتوى، مستوحاة من النسيج التقليدي كما في الهوية.
   بلا صور ولا طلبات شبكة، وتزول بحذف هذه القاعدة. */
html[data-season="nd96"]::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  opacity: 0.045;
  background-image:
    repeating-linear-gradient(60deg, rgb(90, 185, 28) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(-60deg, rgb(90, 185, 28) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(0deg, rgb(123, 93, 32) 0 1px, transparent 1px 52px);
}
html[data-season="nd96"][data-theme="light"]::before { opacity: 0.06; }
@media (max-width: 600px) {
  html[data-season="nd96"]::after { height: 26px; font-size: 0.68rem; }
  html[data-season="nd96"] .site-header { padding-block-start: calc(0.4rem + 26px); }
  html[data-season="nd96"] body:not(.has-app-topbar) { padding-block-start: 26px; }
}
    html[data-season="nd96"][lang="en"]::after { content: "Saudi National Day 96"; }
    html[data-season="nd96"][lang="fr"]::after { content: "Fête nationale saoudienne 96"; }
